<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B站历史查看器</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="tabs">
        <button class="tab active" data-biz="">综合</button>
        <button class="tab" data-biz="archive">视频</button>
        <button class="tab" data-biz="live">直播</button>
        <button class="tab" data-biz="article">专栏</button>
      </nav>

      <!-- 本项目特殊筛选（工具栏中间） -->
      <div class="special-filters">
        <button class="sp-btn" id="spNeeds">需要观看</button>
        <button class="sp-btn sp-drop" id="needFilterToggle" title="更多筛选 / 自动跳过规则">▾</button>
        <button class="sp-btn" id="spArch">含存档</button>
      </div>

      <div class="search">
        <input id="q" type="text" placeholder="搜索视频UP主或标题" autocomplete="off" />
      </div>
      <div class="top-actions">
        <button id="batchBtn" class="btn-sm btn-ghost" title="进入批量勾选模式：可批量跳过或恢复视频">批量</button>
        <button id="syncBtn" class="btn-sm">同步数据</button>
        <button id="fullBtn" class="btn-sm btn-ghost" title="强制全量重新拉取：重新校准“仅本地存档”标记并刷新封面（增量同步不捕获删除，需偶尔全量）">全量重建</button>
      </div>
    </div>
    <div class="topbar-status">
      <div class="status-inner">
        <div id="syncProgress" class="sync-progress hidden">
          <div class="sync-bar"><i></i></div>
          <span id="syncStep" class="sync-step">正在同步历史记录…</span>
        </div>
        <div id="syncDone" class="sync-done hidden">✓ 同步完成</div>
        <span id="syncMeta" class="sync-meta">数据 v— · 更新于 —</span>
      </div>
    </div>
  </header>

  <!-- 更多筛选面板（可折叠） -->
  <section id="filterPanel" class="filter-panel hidden">
    <div class="f-group">
      <span class="f-label active" data-dur="">全部时长</span>
      <span class="f-opt" data-dur="0-600">10分钟以下</span>
      <span class="f-opt" data-dur="600-1800">10-30分钟</span>
      <span class="f-opt" data-dur="1800-3600">30-60分钟</span>
      <span class="f-opt" data-dur="3600-999999">60分钟以上</span>
    </div>
    <div class="f-group">
      <span class="f-label active" data-time="">全部时间</span>
      <span class="f-opt" data-time="today">今天</span>
      <span class="f-opt" data-time="yesterday">昨天</span>
      <span class="f-opt" data-time="week">近一周</span>
      <input type="date" id="panelDateFrom" class="f-date" placeholder="开始日期" />
      <span class="f-sep">至</span>
      <input type="date" id="panelDateTo" class="f-date" placeholder="结束日期" />
    </div>
    <div class="f-group">
      <span class="f-label active" data-dt="">全部设备</span>
      <span class="f-opt" data-dt="2">设备A (dt=2)</span>
      <span class="f-opt" data-dt="3">设备B (dt=3)</span>
      <small class="f-note">⚠️ dt 含义未公开确认，标签为占位符</small>
    </div>

    <hr class="f-div" />

    <!-- 自动跳过规则（持久化到 data/filters.ini；修改即保存） -->
    <div class="f-group f-rule">
      <span class="f-label">类型（勾选 = 需要观看；未勾选 = 自动跳过）</span>
      <label class="chk"><input type="checkbox" class="biz-chk" value="archive" checked />视频</label>
      <label class="chk"><input type="checkbox" class="biz-chk" value="live" checked />直播</label>
      <label class="chk"><input type="checkbox" class="biz-chk" value="article" checked />专栏</label>
      <label class="chk"><input type="checkbox" class="biz-chk" value="pgc" checked />番剧</label>
    </div>
    <div class="f-group f-rule">
      <span class="f-label">最短时长（分钟，0 = 不限；≥ 此值自动跳过）</span>
      <input type="number" id="minDur" class="f-num" min="0" value="0" />
    </div>
    <div class="f-group f-rule">
      <span class="f-label">UP主（逗号分隔，匹配则自动跳过）</span>
      <input type="text" id="authors" class="f-text" placeholder="例如：老高与小茉, 影视飓风" />
    </div>
    <div class="f-group f-rule">
      <button id="applyAutoSkip" class="btn-sm">应用为自动跳过</button>
      <span id="autoSkipHint" class="f-note">按上方规则对全部记录重扫并标记「不需要观看」</span>
    </div>
    <div id="autoSkipProgress" class="sync-progress hidden">
      <div class="sync-bar"><i></i></div>
      <span id="autoSkipStep" class="sync-step"></span>
    </div>
  </section>

  <!-- 批量勾选工具条（进入批量模式后显示） -->
  <section id="batchBar" class="batch-bar hidden">
    <div class="batch-inner">
      <span class="batch-title">批量模式</span>
      <span class="batch-view-tag" id="batchViewTag"></span>
      <div class="batch-modes">
        <select id="batchActionSel" class="btn-sm batch-sel" title="批量动作随当前视图变化"></select>
      </div>
      <span id="batchHint" class="batch-hint"></span>
      <div class="batch-actions">
        <button id="batchSelectAll" class="btn-ghost">全选可操作</button>
        <button id="batchApply" class="btn-sm">应用 (<span id="batchCount">0</span>)</button>
        <button id="batchExit" class="btn-ghost">退出</button>
      </div>
    </div>
  </section>

  <!-- 主体：左侧时间导航 + 右侧卡片网格 -->
  <main class="main-body">
    <aside class="sidebar">
      <div class="side-item active" data-range="today">今天</div>
      <div class="side-item" data-range="yesterday">昨天</div>
      <div class="side-item" data-range="week">近一周</div>
      <div class="side-item" data-range="older">一周前</div>
      <div class="side-item" data-range="month">一个月前</div>
    </aside>

    <section class="content">
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty hidden">没有匹配的记录</div>
      <div id="loadMore" class="loadmore hidden"><button class="btn ghost" id="moreBtn">加载更多</button></div>
      <div id="stats" class="stats-bar"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
